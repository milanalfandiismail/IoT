<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Kontrol LED</title>
  <style>
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #f4f4f5; }
    form { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 280px; }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    label { display: block; font-size: .85rem; margin-bottom: .25rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem; margin-bottom: 1rem; border: 1px solid #d4d4d8; border-radius: 6px; }
    button { width: 100%; padding: .6rem; border: 0; border-radius: 6px; background: #18181b; color: #fff; font-size: 1rem; cursor: pointer; }
    .error { color: #b91c1c; font-size: .85rem; margin: 0 0 1rem; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Kontrol LED</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Masuk</button>
  </form>
</body>
</html>
