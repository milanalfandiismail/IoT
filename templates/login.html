<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — IoT Control</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
  <form class="auth-card" method="post" action="{{ url_for('login_post') }}">
    <h1>IoT<span>Control</span></h1>
    <p class="muted">Masuk untuk mengontrol perangkat.</p>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary wide" type="submit">Masuk</button>
  </form>
</body>
</html>
